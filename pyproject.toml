[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-server-mcp"
version = "0.1.0"
description = "MCP server for SMB/CIFS file share access — list, read, and search files via the Model Context Protocol."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nithin Pradeep", email = "nithinp150@gmail.com" }]
keywords = ["mcp", "smb", "cifs", "file-server", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/nithiin7/remote-file-server-mcp"
dependencies = [
    "mcp>=1.0.0",
    "smbprotocol>=1.15.0",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
]

[project.scripts]
file-server-mcp = "server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
sources = ["."]
include = ["server.py", "config.py", "smb/**", "tools/**", "utils/**"]
