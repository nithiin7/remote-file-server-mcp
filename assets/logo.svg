<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">
  <!-- Background -->
  <rect width="560" height="200" rx="16" fill="#0f172a"/>

  <!-- Left box: MCP Client (purple) -->
  <rect x="148" y="38" width="68" height="68" rx="10" fill="#130d24" stroke="#7c3aed" stroke-width="2.2"/>
  <!-- connected-nodes icon -->
  <circle cx="172" cy="72" r="5.5" fill="#7c3aed"/>
  <circle cx="185" cy="55" r="3.8" fill="#7c3aed" opacity="0.6"/>
  <circle cx="200" cy="66" r="4.5" fill="#7c3aed" opacity="0.85"/>
  <circle cx="186" cy="82" r="3.5" fill="#7c3aed" opacity="0.55"/>
  <line x1="172" y1="72" x2="185" y2="55" stroke="#7c3aed" stroke-width="1.5" opacity="0.35"/>
  <line x1="172" y1="72" x2="200" y2="66" stroke="#7c3aed" stroke-width="1.5" opacity="0.35"/>
  <line x1="185" y1="55" x2="200" y2="66" stroke="#7c3aed" stroke-width="1.5" opacity="0.35"/>
  <line x1="200" y1="66" x2="186" y2="82" stroke="#7c3aed" stroke-width="1.5" opacity="0.35"/>
  <line x1="172" y1="72" x2="186" y2="82" stroke="#7c3aed" stroke-width="1.5" opacity="0.35"/>
  <!-- label -->
  <text x="182" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">MCP Client</text>

  <!-- Dashed connector -->
  <line x1="218" y1="72" x2="340" y2="72" stroke="#1e293b" stroke-width="2.5" stroke-dasharray="7,5"/>
  <!-- arrowhead -->
  <polygon points="335,65.5 348,72 335,78.5" fill="#334155"/>

  <!-- Right box: File Server (blue) -->
  <rect x="344" y="38" width="68" height="68" rx="10" fill="#0a1628" stroke="#2563eb" stroke-width="2.2"/>
  <!-- server rack rows -->
  <rect x="356" y="50" width="44" height="9" rx="2.5" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="392" cy="54.5" r="2.2" fill="#2563eb"/>
  <rect x="356" y="64" width="44" height="9" rx="2.5" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="392" cy="68.5" r="2.2" fill="#2563eb"/>
  <rect x="356" y="78" width="44" height="9" rx="2.5" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="392" cy="82.5" r="2.2" fill="#2563eb"/>
  <!-- label -->
  <text x="378" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">File Server</text>

  <!-- Project name -->
  <text x="280" y="158" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="26" font-weight="700" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">file-server-mcp</text>

  <!-- Tagline -->
  <text x="280" y="182" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle" letter-spacing="3.5">MCP  ·  SMB  ·  READ-ONLY  ·  SECURE</text>
</svg>
